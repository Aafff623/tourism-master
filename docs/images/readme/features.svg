<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7F0E7"/>
      <stop offset="0.55" stop-color="#EFE2D4"/>
      <stop offset="1" stop-color="#E6D3C2"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C45C26"/>
      <stop offset="1" stop-color="#8F3E20"/>
    </linearGradient>
    <linearGradient id="jade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B7C68"/>
      <stop offset="1" stop-color="#244F45"/>
    </linearGradient>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="2" seed="8" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="gray"/>
      <feComponentTransfer in="gray" result="fade">
        <feFuncA type="table" tableValues="0 0.045"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="fade" mode="multiply"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#3B2A22" flood-opacity="0.14"/>
    </filter>
    <style>
      .serif { font-family: 'Noto Serif CJK SC','Source Han Serif SC','SimSun',serif; }
      .sans { font-family: 'Noto Sans CJK SC','Source Han Sans SC','Microsoft YaHei',sans-serif; }
      .muted { fill:#806F63; }
      .deep { fill:#2C2420; }
      .ochre { fill:#A94D25; }
      .jade { fill:#2F6F5E; }
      .hair { stroke:#9A897B; stroke-width:1.5; fill:none; }
      .small { font-size:20px; letter-spacing:2px; }
      .label { font-size:26px; font-weight:600; }
      .sub { font-size:18px; }
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)" filter="url(#paper)"/>
